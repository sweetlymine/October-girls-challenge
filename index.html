<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>October Girls Challenge 🌷</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#fff7fb;color:#3b3040}
.wrap{max-width:1100px;margin:auto;padding:34px 20px 50px}.hero{text-align:center;margin-bottom:24px}
.badge{display:inline-block;background:#ffe4f0;border-radius:999px;padding:7px 13px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
h1{font-size:42px;margin:12px 0 4px;letter-spacing:-1.5px}.sub{color:#8a7889;margin:0}
.panel{background:white;border:1px solid #f1dce8;border-radius:24px;padding:20px;box-shadow:0 10px 35px #d9b8ca35}
.people{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.person{border:2px solid transparent;background:#fff4f8;border-radius:16px;padding:10px 14px;cursor:pointer;font-weight:700}
.person.active{border-color:#d86b9e;background:#ffe6f1}.person span{font-size:22px;margin-right:6px}
.legend{font-size:13px;color:#8a7889;margin-bottom:15px}.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}
.dow{text-align:center;font-size:12px;font-weight:800;color:#a58c9d;padding:8px 0}
.day{min-height:92px;border:1px solid #f0e4eb;border-radius:14px;background:#fffafb;padding:8px;cursor:pointer;transition:.15s}
.day:hover{transform:translateY(-2px);box-shadow:0 5px 15px #c996ad25}.num{font-size:12px;font-weight:800;color:#9a8290}
.stickers{display:flex;flex-wrap:wrap;gap:3px;margin-top:7px}.sticker{font-size:25px;line-height:1}
.empty{background:transparent;border:0;cursor:default}.stats{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}
.stat{background:#fff4f8;border-radius:15px;padding:11px 15px}.stat b{font-size:20px}
.status{text-align:center;font-size:13px;color:#917d8d;margin-top:16px}.status.ok{color:#4d8b67}.status.err{color:#b54b70}
@media(max-width:650px){h1{font-size:32px}.day{min-height:72px}.sticker{font-size:21px}.wrap{padding:24px 10px}}
</style></head>
<body><div class="wrap">
<div class="hero"><div class="badge">🌷 reto entre amigas</div><h1>October Girls Challenge</h1><p class="sub">¿Hiciste ejercicio? Deja tu sticker. 💗</p></div>
<div class="panel"><div class="people" id="people"></div>
<div class="legend">Selecciona tu nombre y luego haz clic en cualquier día para poner/quitar tu sticker.</div>
<div class="grid" id="calendar"></div><div class="stats" id="stats"></div>
<div class="status" id="status">Modo demo: conecta Supabase para compartir los cambios.</div></div></div>
<script>
const people=[
{name:"Sophia",emoji:"🦋"},{name:"Cami",emoji:"🐰"},{name:"Cris",emoji:"🐻"},
{name:"Paola",emoji:"🐱"},{name:"Salome",emoji:"🌸"}];
const SUPABASE_URL="https://duijumkvmqmejpvtlkit.supabase.co"; const SUPABASE_ANON_KEY="sb_publishable_wWNW6AXL8qms9QRlB__Bbg_4R6G9JzT";
let selected=1, data={};
const peopleEl=document.getElementById("people");
people.forEach((p,i)=>{const b=document.createElement("button");b.className="person"+(i===selected?" active":"");
b.innerHTML=`<span>${p.emoji}</span>${p.name}`;b.onclick=()=>{selected=i;document.querySelectorAll(".person").forEach(x=>x.classList.remove("active"));b.classList.add("active")};peopleEl.appendChild(b)});
const cal=document.getElementById("calendar");
["L","M","X","J","V","S","D"].forEach(x=>{let d=document.createElement("div");d.className="dow";d.textContent=x;cal.appendChild(d)});
const first=new Date(2026,9,1).getDay(), offset=(first+6)%7;
for(let i=0;i<offset;i++){let e=document.createElement("div");e.className="day empty";cal.appendChild(e)}
for(let day=1;day<=31;day++){let c=document.createElement("div");c.className="day";c.innerHTML=`<div class="num">${day}</div><div class="stickers" id="s${day}"></div>`;
c.onclick=()=>toggle(day);cal.appendChild(c)}
function setStatus(t,cls=""){let s=document.getElementById("status");s.textContent=t;s.className="status "+cls}
function render(){for(let d=1;d<=31;d++){let box=document.getElementById("s"+d);box.innerHTML="";(data[d]||[]).forEach(i=>{let s=document.createElement("span");s.className="sticker";s.title=people[i].name;s.textContent=people[i].emoji;box.appendChild(s)})}
document.getElementById("stats").innerHTML=people.map((p,i)=>{let n=Object.values(data).filter(a=>a.includes(i)).length;return `<div class="stat">${p.emoji} ${p.name}: <b>${n}</b> días</div>`}).join("")}
function toggle(day){data[day]??=[];let pos=data[day].indexOf(selected);if(pos>=0)data[day].splice(pos,1);else data[day].push(selected);render();save(day)}
async function save(day){if(!SUPABASE_URL||!SUPABASE_ANON_KEY){localStorage.setItem("octoberGirls",JSON.stringify(data));setStatus("Guardado en este navegador. Falta conectar la base online.","");return}
const row={day,member:people[selected].name,active:data[day].includes(selected),month:"2026-10"};
try{await fetch(SUPABASE_URL+"/rest/v1/checkins",{method:"POST",headers:{"apikey":SUPABASE_ANON_KEY,"Authorization":"Bearer "+SUPABASE_ANON_KEY,"Content-Type":"application/json","Prefer":"resolution=merge-duplicates"},body:JSON.stringify(row)});setStatus("✨ Guardado para todas.","ok")}catch(e){setStatus("No se pudo guardar online.","err")}}
async function load(){if(!SUPABASE_URL||!SUPABASE_ANON_KEY){data=JSON.parse(localStorage.getItem("octoberGirls")||"{}");render();return}
try{let r=await fetch(SUPABASE_URL+"/rest/v1/checkins?select=day,member,active&month=eq.2026-10",{headers:{apikey:SUPABASE_ANON_KEY,Authorization:"Bearer "+SUPABASE_ANON_KEY}});let rows=await r.json();data={};rows.forEach(x=>{let i=people.findIndex(p=>p.name===x.member);if(i>=0&&x.active)(data[x.day]??=[]).push(i)});render();setStatus("☁️ Calendario compartido online.","ok")}catch(e){setStatus("No se pudo cargar el calendario online.","err")}}
load();
setInterval(async ()=>{
  if(document.visibilityState==="visible") await load();
}, 3000);
</script></body></html>
